<!DOCTYPE html>
<html>
<head>
<title>BoB Files Safe Link</title>

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #0a0a0a, #111);
    font-family: 'Segoe UI', sans-serif;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Floating card */
.container {
    background: rgba(20,20,20,0.7);
    backdrop-filter: blur(15px);
    padding: 50px;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(0,255,200,0.1);
    text-align: center;
    animation: float 3s ease-in-out infinite;
}

/* Title */
h1 {
    font-size: 32px;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #00ffc3, #00aaff);
    -webkit-background-clip: text;
    color: transparent;
}

/* Input */
input {
    width: 350px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #111;
    color: white;
    outline: none;
    transition: 0.3s;
}

input:focus {
    box-shadow: 0 0 15px #00ffc3;
}

/* Button */
button {
    padding: 12px 25px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #00ffc3, #00aaff);
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00ffc3;
}

/* Copy Button */
.copy-btn {
    margin-left: 10px;
    background: #222;
    color: white;
}

/* Floating animation */
@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

/* Fade in */
.container {
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9);}
    to { opacity: 1; transform: scale(1);}
}

/* Success text */
#copiedText {
    color: #00ffc3;
    margin-top: 10px;
}
</style>

</head>

<body>

<div class="container">

<h1>🔐 BoB Files Safe Link</h1>

<form method="POST" action="/create">
<input type="text" name="url" placeholder="Paste your URL here..." required>
<br><br>
<button>Generate Safe Link</button>
</form>

{% if safe_link %}
<h3>Your Safe Link:</h3>

<div style="display:flex; justify-content:center; align-items:center;">
<input id="linkBox" value="{{ safe_link }}" readonly>
<button class="copy-btn" onclick="copyLink()">Copy</button>
</div>

<p id="copiedText" style="display:none;">Copied successfully!</p>
{% endif %}

</div>

<script>
function copyLink() {
    let text = document.getElementById("linkBox").value;
    navigator.clipboard.writeText(text);

    let msg = document.getElementById("copiedText");
    msg.style.display = "block";

    setTimeout(()=>{ msg.style.display="none"; }, 2000);
}
</script>

</body>
</html>
