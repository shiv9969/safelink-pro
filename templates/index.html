<!DOCTYPE html>
<html>
<head>
<title>BoB Files Safe Link</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    background: radial-gradient(circle at top, #0a0a0a, #000);

    opacity: 0;
    filter: blur(10px);
    transform: translateY(20px);
    transition: all 0.6s ease;
}

body.loaded {
    opacity: 1;
    filter: blur(0);
    transform: translateY(0);
}

/* PARTICLES */
canvas {
    position: fixed;
    top: 0;
    left: 0;
}

/* CARD */
.container {
    position: relative;
    z-index: 2;
    margin-top: 120px;
    text-align: center;
    background: rgba(20,20,20,0.7);
    backdrop-filter: blur(20px);
    padding: 50px;
    border-radius: 20px;
    box-shadow: 0 0 50px rgba(0,255,200,0.1);
    animation: fadeIn 1s ease;
}

/* TITLE */
h1 {
    font-size: 32px;
    background: linear-gradient(90deg, #00ffc3, #00aaff);
    -webkit-background-clip: text;
    color: transparent;
}

/* INPUT */
input {
    width: 350px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #111;
    color: white;
}

input:focus {
    box-shadow: 0 0 15px #00ffc3;
}

/* BUTTON */
button {
    padding: 12px 25px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #00ffc3, #00aaff);
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.07);
    box-shadow: 0 0 25px #00ffc3;
}

/* COPY BUTTON */
.copy-btn {
    margin-left: 10px;
    background: #222;
    color: white;
}

/* SUCCESS TEXT */
#copiedText {
    color: #00ffc3;
}

/* ERROR BOX */
.error-box {
    background: rgba(255, 0, 0, 0.1);
    border: 1px solid rgba(255, 0, 0, 0.4);
    color: #ff4d4d;
    padding: 12px;
    border-radius: 10px;
    margin-top: 15px;
    box-shadow: 0 0 10px rgba(255,0,0,0.2);
    animation: fadeError 0.5s ease;
}

@keyframes fadeError {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

</head>

<body>

<canvas id="particles"></canvas>

<div class="container">

<h1 id="typing"></h1>

<form method="POST" action="/create">
<input type="text" name="url" placeholder="Paste your URL here..." required>
<br><br>
<button>Generate Safe Link</button>
</form>

<!-- 🔥 ERROR MESSAGE -->
{% if error %}
<div class="error-box">
    ⚠ {{ error }}
</div>
{% endif %}

<!-- 🔗 SAFE LINK -->
{% if safe_link %}
<h3>Your Safe Link:</h3>

<div style="display:flex; justify-content:center;">
<input id="linkBox" value="{{ safe_link }}" readonly>
<button class="copy-btn" onclick="copyLink()">Copy</button>
</div>

<p id="copiedText" style="display:none;">Copied successfully!</p>
{% endif %}

</div>

<script>
/* Page load */
window.addEventListener("load", () => {
    document.body.classList.add("loaded");
});

/* Typing */
let text = "🔐 BoB Files Safe Link";
let i = 0;
function type() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(type, 40);
    }
}
type();

/* Copy */
function copyLink() {
    let text = document.getElementById("linkBox").value;
    navigator.clipboard.writeText(text);

    let msg = document.getElementById("copiedText");
    msg.style.display = "block";

    setTimeout(()=>{ msg.style.display="none"; }, 2000);
}

/* Particles */
let canvas = document.getElementById("particles");
let ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 120; i++) {
    particles.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*2,
        dx: (Math.random()-0.5),
        dy: (Math.random()-0.5)
    });
}

function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle = "#00ffc3";
        ctx.fill();

        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
    });

    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
