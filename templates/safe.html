<!DOCTYPE html>
<html>
<head>
<title>BoB Files Safe Link</title>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    color: white;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.container {
    text-align: center;
    background: rgba(20,20,20,0.9);
    padding: 40px;
    border-radius: 20px;
}

/* Center captcha */
.captcha-box {
    display: flex;
    justify-content: center;
    margin-top: 15px;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(90deg, #00ffc3, #00aaff);
    color: black;
    cursor: pointer;
}
</style>

</head>

<body>

<div class="container">

<h2>🔐 Verify to Continue</h2>

<form method="POST">

<div class="captcha-box">
    <div class="g-recaptcha"
         data-sitekey="{{ site_key }}"
         data-callback="captchaSuccess">
    </div>
</div>

<button id="btn" style="display:none;">Continue</button>

</form>

</div>

<script>
function captchaSuccess() {
    document.getElementById("btn").style.display = "inline-block";
}
</script>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>

</body>
</html>
